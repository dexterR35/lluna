name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: midgard-windows-x64
            requirements: requirements-cpu.txt
          - os: ubuntu-latest
            artifact: midgard-linux-x64
            requirements: requirements-cpu.txt
          - os: macos-latest
            artifact: midgard-macos-universal
            requirements: requirements-macos.txt
    runs-on: ${{ matrix.os }}
    env:
      MIDGARD_TESTING: "1"
      MIDGARD_DISABLE_UPDATE_CHECK: "1"
      MIDGARD_DISABLE_MODEL_DOWNLOADS: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-packaging.txt
            requirements-cpu.txt
            requirements.txt
            constraints.txt
      - name: Install packaging environment
        run: >-
          python -m pip install
          -r ${{ matrix.requirements }}
          -r requirements-packaging.txt
          -r requirements-test.txt
          -c constraints.txt
      - name: Verify before packaging
        run: python -m pytest -q
      - name: Build portable desktop application
        run: python packaging/build.py --clean
      - name: Upload unsigned portable application
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Midgard
            dist/Midgard.app
          if-no-files-found: error
