name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  MIDGARD_TESTING: "1"
  MIDGARD_DISABLE_UPDATE_CHECK: "1"
  MIDGARD_DISABLE_MODEL_DOWNLOADS: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    name: ${{ matrix.target }}
    environment: release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64-cpu
            os: windows-2025
            platform: windows
            architecture: x64
            profile: cpu
          - target: windows-x64-cuda
            os: windows-2025
            platform: windows
            architecture: x64
            profile: cuda
          - target: windows-x64-directml
            os: windows-2025
            platform: windows
            architecture: x64
            profile: directml
          - target: linux-x64-cpu
            os: ubuntu-24.04
            platform: linux
            architecture: x64
            profile: cpu
          - target: linux-x64-cuda
            os: ubuntu-24.04
            platform: linux
            architecture: x64
            profile: cuda
          - target: macos-x64-mps
            os: macos-15-intel
            platform: macos
            architecture: x64
            profile: mps
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Verify release version
        if: github.ref_type == 'tag'
        run: python packaging/verify_release.py --tag ${{ github.ref_name }}
      - name: Install release profile
        run: python packaging/install_profile.py --profile ${{ matrix.profile }}
      - name: Verify before packaging
        run: python -m pytest -q
      - name: Build frozen application
        run: >-
          python packaging/build.py --clean
          --profile ${{ matrix.profile }}
          --architecture ${{ matrix.architecture }}

      - name: Require Windows signing certificate for a release tag
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for release tags"
          }
      - name: Sign Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { exit 0 }
          $cert = Join-Path $env:RUNNER_TEMP "midgard-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD dist\Midgard\Midgard.exe
          & $signtool.FullName verify /pa dist\Midgard\Midgard.exe
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "0.0.0-dev"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" "/DBuildProfile=${{ matrix.profile }}" `
            packaging\windows\Midgard.iss
      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { exit 0 }
          $cert = Join-Path $env:RUNNER_TEMP "midgard-signing.pfx"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          $installer = Get-ChildItem release\*.exe | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          & $signtool.FullName verify /pa $installer.FullName

      - name: Build Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="0.0.0-dev"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          python packaging/linux/package.py \
            --version "$version" \
            --profile "${{ matrix.profile }}" \
            --architecture "${{ matrix.architecture }}"

      - name: Require Apple signing credentials for a release tag
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          [[ -n "$APPLE_CERTIFICATE_BASE64" ]]
          [[ -n "$APPLE_SIGNING_IDENTITY" ]]
          [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [[ -n "$APPLE_CERTIFICATE_BASE64" ]] || exit 0
          certificate="$RUNNER_TEMP/midgard-signing.p12"
          keychain="$RUNNER_TEMP/midgard-signing.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"
      - name: Sign and verify macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          [[ -n "$APPLE_SIGNING_IDENTITY" ]] || exit 0
          codesign --deep --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" dist/Midgard.app
          codesign --verify --deep --strict --verbose=2 dist/Midgard.app
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="0.0.0-dev"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/macos/create_dmg.sh \
            "$version" "${{ matrix.profile }}" "${{ matrix.architecture }}"
      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          [[ -n "$APPLE_ID" ]] || exit 0
          dmg="$(find release -name '*.dmg' -print -quit)"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: Upload packaged target
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      MIDGARD_UPDATE_PRIVATE_KEY_B64: ${{ secrets.MIDGARD_UPDATE_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-packaging.txt -c constraints.txt
      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true
      - name: Require release manifest signing key
        shell: bash
        run: test -n "$MIDGARD_UPDATE_PRIVATE_KEY_B64"
      - name: Create signed release manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          python packaging/release_manifest.py \
            --version "$version" \
            --assets-dir release \
            --base-url "$base" \
            --output release/midgard-update.json \
            --signature-output release/midgard-update.json.sig
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release/*
      - name: Publish GitHub Release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
