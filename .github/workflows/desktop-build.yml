name: Electron Desktop Release
on:
  workflow_dispatch:
  push: {tags: ["v*.*.*"]}
permissions: {contents: read}
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, profile: cpu, requirements: cpu}
          - {os: ubuntu-24.04, profile: cpu, requirements: cpu}
          - {os: macos-15, profile: mps, requirements: macos}
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 120
    env: {LLUNA_TESTING: "1", LLUNA_DISABLE_MODEL_DOWNLOADS: "1", LLUNA_FAKE_WORKER: "1"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v6
        with: {node-version: "24", cache: npm}
      # requirements-ci.txt alone omits the AI stack (torch/diffusers/
      # transformers/...), so PyInstaller's can_import_module() guards in
      # backend-sidecar.spec silently skip bundling it - the build would
      # succeed but ship a sidecar missing those runtimes.
      - run: python -m pip install -r requirements-ci.txt -r requirements-${{ matrix.requirements }}.txt -r requirements-packaging.txt
      - run: npm ci --allow-git=all
      - run: python scripts/static_guards.py
      - run: python packaging/build.py --clean --profile ${{ matrix.profile }}
      - uses: actions/upload-artifact@v6
        with: {name: "lluna-${{ runner.os }}-${{ matrix.profile }}", path: "frontend/out/make/**/*", if-no-files-found: error}
