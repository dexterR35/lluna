name: Quality
on:
  pull_request:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "quality-${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true}
jobs:
  test:
    strategy: {fail-fast: false, matrix: {os: [ubuntu-latest, windows-latest, macos-latest]}}
    runs-on: ${{ matrix.os }}
    env: {MIDGARD_TESTING: "1", MIDGARD_DISABLE_UPDATE_CHECK: "1", MIDGARD_DISABLE_MODEL_DOWNLOADS: "1", MIDGARD_FAKE_WORKER: "1"}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v6
        with: {node-version: "24", cache: npm}
      - run: python -m pip install -r requirements-ci.txt
      - name: Install CPU Torch (Linux and Windows)
        if: runner.os != 'macOS'
        run: python -m pip install -r requirements-ci-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - name: Install CPU Torch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-ci-torch.txt
      - run: npm ci --allow-git=all
      - name: Removed-stack and dependency guards
        run: python scripts/static_guards.py
      - name: Compile Python
        run: python -m compileall -q midgard.py install.py backend
      - name: Python tests
        run: python -m pytest -q
      - name: Frontend tests
        run: npm run test:frontend
      - name: Renderer build
        run: npm run build
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v6
        with: {node-version: "24", cache: npm}
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --allow-git=all
      - run: python scripts/static_guards.py
      - run: ruff check backend/api backend/artifacts backend/configuration backend/graph tests
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
