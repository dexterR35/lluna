name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MIDGARD_TESTING: "1"
      MIDGARD_DISABLE_UPDATE_CHECK: "1"
      MIDGARD_DISABLE_MODEL_DOWNLOADS: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci-torch.txt
            requirements-ci.txt
            requirements-test.txt
            constraints.txt
      - name: Install CPU-only Torch
        if: runner.os != 'macOS'
        run: >-
          python -m pip install -r requirements-ci-torch.txt
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install macOS Torch
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-ci-torch.txt
      - name: Install safe test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile
        run: python -m compileall -q gui.py install.py backend ui
      - name: Test
        run: python -m pytest -q

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: >-
          ruff check
          backend/core backend/hardware backend/settings backend/application
          backend/diagnostics backend/media backend/onboarding tests
      - name: Format
        run: >-
          ruff format --check
          backend/core backend/hardware backend/settings backend/application
          backend/diagnostics backend/media backend/onboarding tests
      - name: Type boundaries
        run: >-
          mypy --ignore-missing-imports
          backend/core backend/hardware backend/settings backend/application
          backend/diagnostics backend/media backend/onboarding
      - name: Bandit
        run: >-
          bandit -q -r backend/core backend/hardware backend/settings
          backend/application backend/diagnostics backend/media backend/onboarding
      - name: Dependency audit
        run: pip-audit -r requirements-test.txt

  launchers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install launcher test dependencies
        run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests/test_installer_launchers.py
      - run: bash -n install.sh run_gui.sh
