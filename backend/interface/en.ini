BgRemoveModelsSettingDesc = Install and enable ONNX cutout models for the Remove BG tool (images only). On = appears in the Run dropdown when installed. Defaults are tuned for photos, people, anime, and clothing.
EnhanceModelsSetting = Enhance Models
EnhanceModelsSettingDesc = Real-ESRGAN upscalers for the Enhance dialog after background removal (images only). 2× is the default balance; 4× is sharper but slower and heavier.
SelectObjectModelsSetting = Select Object Models
SelectObjectModelsSettingDesc = SAM2 + Grounding DINO for Select Object in Protect areas (Edit keep mask). Each card installs one model set only (standard or More complex).
SelectObjectMoreComplex = More complex
SelectObjectMoreComplexDesc = Use the More complex model set when it is installed. Off uses the standard set.
SubtitleDetectionSetting = Subtitle Detection Settings
SubtitleDetectionSettingDesc = Fine-tune how OCR finds subtitle boxes before inpainting. Applies to video and single-frame images. Start with defaults; change one slider at a time if detection misses text or catches logos.
SttnSetting = STTN Settings
SttnSettingDesc = Controls STTN Smart Inpainting and STTN Subtitle Detection on video. Affects speed, VRAM, and repair quality - not used for Remove BG or static OpenCV-only runs.
ProPainterSetting = ProPainter Settings
ProPainterSettingDesc = Batch size for the ProPainter inpaint model on fast-moving video. Needs more VRAM than STTN; lower this first if you hit out-of-memory errors.
AboutSetting = About
HardwareAcceleration = Hardware Acceleration
HardwareAccelerationDesc = Use GPU / ONNX for OCR, inpainting, and Remove BG when available. Turn off only for debugging or if a driver issue forces CPU fallback.
HardwareAccelerationNO = CPU version cannot enable hardware acceleration
SubtitleYXAxisDifferencePixel = Height-Width Pixel Difference Threshold
SubtitleYXAxisDifferencePixelDesc = Rejects detections whose box is taller than wide by more than this many pixels. Real subtitles are usually horizontal bars.
    Video: keep near default (10) for bottom hard subs and most ASS/SRT burns. Raise if vertical watermarks are wrongly treated as subtitles.
    Images: same rule for one-frame OCR. Lower = stricter shape filter; higher = may skip tall or stacked text.
SubtitleAreaDeviationPixel = Allowed Pixel Offset
SubtitleAreaDeviationPixelDesc = Expands each detected box outward before inpainting so anti-aliased edges and glow are fully covered.
    Video: default (10) suits most 1080p subs. Increase if faint edges remain after removal; decrease if background outside the text is blurred.
    Images: helpful for thin or semi-transparent watermark text. Too high may erase nearby detail.
SubtitleAreaYAxisDifferencePixel = Same-line Subtitle Height Difference Threshold
SubtitleAreaYAxisDifferencePixelDesc = Maximum vertical gap (pixels) to treat two boxes as the same subtitle line when merging detections.
    Video: default (20) works for single-line subs. Raise for multi-line credits or stacked karaoke; lower if separate lines merge into one mask.
    Images: rarely needed unless the frame has several text lines close together.
SubtitleAreaPixelToleranceYPixel = Y-axis Pixel Tolerance
SubtitleAreaPixelToleranceYPixelDesc = How far two boxes can differ vertically and still be considered the same subtitle region across frames.
    Video: stabilizes flickering OCR boxes between frames. Increase for shaky or bouncing subs; decrease if unrelated lines get glued together.
    Images: usually leave at default unless you merge duplicate boxes manually.
SubtitleAreaPixelToleranceXPixel = X-axis Pixel Tolerance
SubtitleAreaPixelToleranceXPixelDesc = Horizontal distance allowed when matching similar subtitle boxes frame to frame.
    Video: default (20) fits centered bottom subs. Widen for subs that slide or change width; tighten if side logos match subtitle motion.
    Images: increase only when one long line is split into many small boxes.
SubtitleTimelineBackwardFrameCount = Timeline Backward Frames
SubtitleTimelineBackwardFrameCountDesc = Extra frames processed before each detected subtitle segment (fade-in, type-on, or early glow).
    Video: default (3) handles soft fades. Raise for slow fade-ins or long lead-in animations; zero for hard-cut TV subs.
    Images: not used - single frame only.
SubtitleTimelineForwardFrameCount = Timeline Forward Frames
SubtitleTimelineForwardFrameCountDesc = Extra frames processed after each subtitle segment (fade-out or lingering shadow).
    Video: default (3) handles soft fade-outs. Raise for long dissolves; lower if the next scene gets partially inpainted.
    Images: not used - single frame only.
SttnNeighborStride = Reference Frame Stride
SttnNeighborStrideDesc = Step size when picking neighbor frames as references for STTN repair (default 5).
    Video: lower stride = denser references, better quality, more VRAM and time. Higher = faster, may show patch seams on fast motion.
    Best for: live-action dialogue, talking heads. Less ideal: heavy camera shake or whip pans - try ProPainter instead.
SttnReferenceLength = Reference Frame Count
SttnReferenceLengthDesc = How many past/future frames STTN consults for context when filling masked areas (default 10).
    Video: more frames = smoother inpaint on moving backgrounds, but slower and more VRAM. Reduce on 4–6 GB GPUs.
    Best for: films and vlogs with moderate motion. Animation: pair with LAMA inpaint mode if STTN smears flat color.
SttnMaxLoadNum = Max Concurrent Processing Frames
SttnMaxLoadNumDesc = Batch size - how many frames STTN loads at once (default 50). Must stay above stride × reference length.
    Video: higher = better temporal consistency, much more VRAM. Lower first if you see out-of-memory errors (try 20–30 on 8 GB).
    Images: one frame at a time - this mainly affects multi-frame smart inpaint on short clips.
PropainterMaxLoadNum = Max Concurrent Processing Frames
PropainterMaxLoadNumDesc = ProPainter batch size (default 70). At 720p, ~50 needs ~19 GB VRAM and ~80 needs ~25 GB.
    Video: use for sports, action, or strong parallax where STTN leaves trails. Start at 30–50 on 8 GB cards.
    Images: single-frame jobs ignore batching; this matters for video only.
CheckUpdateOnStartup = Check Updates on Startup
CheckUpdateOnStartupDesc = Looks for a new Midgard release when the app opens. Recommended - updates include stability fixes and model improvements.
