[GenerateModelDesc]
FLUX2_KLEIN_4B = Black Forest Labs FLUX.2 [klein] 4B (Apache 2.0). Optional fast 4-step distilled text-to-image model. Needs ~13 GB VRAM / CUDA.
FLUX2_KLEIN_9B = Black Forest Labs FLUX.2 [klein] 9B (non-commercial license). Higher quality 4-step generation. Needs ~29 GB VRAM (e.g. RTX 4090+). Install only when needed; may require a Hugging Face login for the gated repo.
FLUX2_KLEIN_BASE_4B = Black Forest Labs FLUX.2 [klein] 4B Base (Apache 2.0). Default non-distilled model for flexible generation and fine-tuning. Uses 50 steps and guidance 4.0.
FLUX2_KLEIN_BASE_9B = Black Forest Labs FLUX.2 [klein] 9B Base (non-commercial license). Non-distilled research and fine-tuning model. Uses 50 steps and guidance 4.0; requires substantial VRAM.
SDXL_TURBO = Stability AI SDXL Turbo (OpenRAIL++). Light model optimized for 1 step at guidance 0.0 and 512 x 512; optional 2- and 4-step presets are available.
SD15 = Stable Diffusion v1.5 (OpenRAIL-M). Classic lightweight 512 x 512 model. Normal uses the pipeline default of 50 steps and guidance 7.5.

