[BgRemoveModelDesc]
U2NET = Classic general cutout - everyday photos, products, and simple shapes. Fast download; good first choice if BiRefNet is too heavy.
U2NETP = Lightweight U2-Net - quick previews and low-end GPUs. Trades some edge detail for speed.
U2NET_HUMAN = People and portraits - hair, skin, and full-body shots. Best for profile photos and human-centric images.
U2NET_CLOTH = Clothing and fashion - separates garments from mannequins or models. Good for e-commerce flat lays.
SILUETA = Compact general model - small download, fast runs. Fine for icons, simple objects, and batch thumbnails.
ISNET = Strong all-purpose cutout - sharper edges than U2-Net on complex backgrounds. Photos, objects, mild hair.
ISNET_ANIME = Anime, cartoons, and flat illustration - clean lines and solid color regions. Not ideal for noisy live photos.
BIREFNET = Default high-quality general cutout - best everyday photo result. Recommended starting model for most images.
BIREFNET_LITE = Faster BiRefNet - when IS-Net-level speed matters but you still want modern edge quality.
BIREFNET_PORTRAIT = Faces and upper-body portraits - refined hair and skin edges on people photos.
BIREFNET_MASSIVE = Largest BiRefNet - maximum edge quality; slow and VRAM-heavy. High-res product or studio work.
BIREFNET_DIS = High-detail / dichotomous edges - tricky boundaries and fine structures (DIS training).
BIREFNET_HRSOD = High-resolution salient objects - large subjects that fill the frame.
BIREFNET_COD = Camouflaged or low-contrast subjects - objects that blend into the background.
BRIA_RMBG = Commercial-grade RMBG - excellent edges on photos; large download. Studio and marketing assets.

